<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Cập Nhật Bảng Giá Nguyên Liệu Vàng Bạc T3Gold</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS tùy chỉnh -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="min-h-screen flex items-center justify-center p-4 bg-[#0b1120] text-slate-100">

    <div class="w-full max-w-md">
        <!-- Logo & Branding -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center shadow-lg shadow-yellow-500/20">
                    <svg class="text-slate-950" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 12a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2Z" />
                        <path d="M12 2v20" />
                        <path d="m19 15 3 3" />
                        <path d="m19 9 3-3" />
                        <path d="M2 12h4" />
                        <path d="m5 15-3 3" />
                        <path d="m5 9-3-3" />
                    </svg>
                </div>
                <div class="text-left">
                    <h1 class="text-xl font-extrabold tracking-tight">
                        Cập Nhật Bảng Giá Nguyên Liệu Vàng Bạc <span
                            class="text-yellow-400 font-extrabold">T3Gold</span>
                    </h1>
                    <p class="text-[11px] text-slate-400">Xem bảng giá vàng & bạc trực tuyến</p>
                </div>
            </a>
        </div>

        <!-- Auth Card -->
        <div class="dashboard-card p-6 md:p-8 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden">
            <!-- Tab Switcher -->
            <div class="flex items-center bg-slate-950/80 p-1 rounded-xl border border-slate-800 mb-6">
                <button id="btn-tab-login" onclick="switchAuthMode('login')"
                    class="flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-yellow-500 text-slate-950 shadow-md">
                    Đăng Nhập
                </button>
                <button id="btn-tab-register" onclick="switchAuthMode('register')"
                    class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
                    Đăng Ký Tài Khoản
                </button>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email hoặc Số điện thoại</label>
                    <input type="text" id="login-account" required placeholder="name@example.com hoặc 0912345678"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300">Mật khẩu</label>
                        <a href="javascript:void(0)"
                            onclick="alert('Vui lòng liên hệ quản trị viên để lấy lại mật khẩu!')"
                            class="text-[11px] text-yellow-400 hover:underline">Quên mật khẩu?</a>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember-me" checked
                        class="rounded bg-slate-900 border-slate-700 text-yellow-500 focus:ring-0 cursor-pointer" />
                    <label for="remember-me" class="text-xs text-slate-400 cursor-pointer">Ghi nhớ đăng nhập</label>
                </div>

                <div id="login-error"
                    class="hidden text-xs text-rose-400 bg-rose-950/60 p-2.5 rounded-lg border border-rose-800"></div>

                <button type="submit"
                    class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-bold text-sm shadow-lg shadow-yellow-500/20 transition-all cursor-pointer">
                    Đăng Nhập Ngay
                </button>

                <!-- Nút dùng thử nhanh -->
                <button type="button" onclick="loginDemo()"
                    class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold text-xs border border-slate-700 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                    <span>⚡ Dùng thử nhanh (Tài khoản Demo)</span>
                </button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Họ và tên</label>
                    <input type="text" id="reg-name" required placeholder="Nguyễn Văn A"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email hoặc Số điện thoại</label>
                    <input type="text" id="reg-account" required placeholder="name@example.com hoặc 0912345678"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mật khẩu</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Tối thiểu 6 ký tự"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm" required minlength="6" placeholder="Nhập lại mật khẩu"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm outline-none focus:border-yellow-500 transition-colors" />
                </div>

                <div id="reg-error"
                    class="hidden text-xs text-rose-400 bg-rose-950/60 p-2.5 rounded-lg border border-rose-800"></div>

                <button type="submit"
                    class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-bold text-sm shadow-lg shadow-yellow-500/20 transition-all cursor-pointer">
                    Tạo Tài Khoản & Xem Bảng Giá
                </button>
            </form>

            <div class="mt-5 pt-4 border-t border-slate-800 text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200 transition-colors">
                    ← Quay lại Trang Chủ
                </a>
            </div>
        </div>
    </div>

    <!-- Script Auth -->
    <script>
        // Kiểm tra theme lưu trữ
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        }

        // Kiểm tra nếu có param ?mode=register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'register') {
            switchAuthMode('register');
        }

        function switchAuthMode(mode) {
            const btnLogin = document.getElementById('btn-tab-login');
            const btnReg = document.getElementById('btn-tab-register');
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-register');

            if (mode === 'login') {
                btnLogin.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-yellow-500 text-slate-950 shadow-md';
                btnReg.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
            } else {
                btnReg.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-yellow-500 text-slate-950 shadow-md';
                btnLogin.className = 'flex-1 py-2 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white';
                formReg.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const account = document.getElementById('login-account').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');

            if (!account || !password) {
                errorEl.textContent = 'Vui lòng nhập đầy đủ tài khoản và mật khẩu!';
                errorEl.classList.remove('hidden');
                return;
            }

            // Đăng nhập thành công -> lưu session
            const user = {
                name: account.includes('@') ? account.split('@')[0] : account,
                account: account,
                isLoggedIn: true,
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('auth_user', JSON.stringify(user));
            window.location.href = 'index.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const account = document.getElementById('reg-account').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const confirm = document.getElementById('reg-confirm').value.trim();
            const errorEl = document.getElementById('reg-error');

            if (password !== confirm) {
                errorEl.textContent = 'Mật khẩu xác nhận không khớp!';
                errorEl.classList.remove('hidden');
                return;
            }

            const user = {
                name: name || account,
                account: account,
                isLoggedIn: true,
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('auth_user', JSON.stringify(user));
            alert('🎉 Đăng ký tài khoản thành công! Bạn có thể xem toàn bộ bảng giá.');
            window.location.href = 'index.html';
        }

        function loginDemo() {
            const demoUser = {
                name: 'Khách hàng Demo',
                account: 'demo@thitruonggia.vn',
                isLoggedIn: true,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('auth_user', JSON.stringify(demoUser));
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
